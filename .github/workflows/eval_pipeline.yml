name: RAG Evaluation Pipeline

# 触发条件
on:
  push:
    branches:
      - main
    paths:
      - 'iteration8/corpus/doc-*.txt'
      - 'iteration8/corpus/queries.json'
      - 'iteration8/*.py'
      - 'iteration8/requirements.txt'
      - 'iteration8/rejection_config.json'
  
  # 支持手动触发
  workflow_dispatch:
    inputs:
      chunking_strategy:
        description: 'Chunking strategy'
        required: false
        default: 'fixed_100_50'
        type: choice
        options:
          - fixed_100_50
          - fixed_200_40
          - fixed_300_30
          - semantic
      retrieval_mode:
        description: 'Retrieval mode'
        required: false
        default: 'hybrid'
        type: choice
        options:
          - hybrid
          - vector
          - bm25
          - random
      rerank_mode:
        description: 'Rerank mode'
        required: false
        default: 'bge'
        type: choice
        options:
          - bge
          - none
      judge_mode:
        description: 'Judge mode'
        required: false
        default: 'none'
        type: choice
        options:
          - deepseek
          - none
      rejection_preset:
        description: 'Rejection preset'
        required: false
        default: 'aggressive'
        type: choice
        options:
          - conservative
          - moderate
          - aggressive
      max_queries:
        description: 'Max queries to evaluate (for testing)'
        required: false
        default: '1'
        type: string
      query_from:
        description: 'Start from query index (1-based, leave empty for random)'
        required: false
        default: ''
        type: string
      batch_size:
        description: 'Concurrent batch size for API calls'
        required: false
        default: '10'
        type: string

# 权限设置：需要写入权限以提交结果
permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    
    # 限制并发：同时只运行一个评估
    # 使用 queue 策略：新任务等待旧任务完成，而不是取消
    concurrency:
      group: evaluation-pipeline
      cancel-in-progress: false  # 不取消正在运行的，而是排队等待
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史，用于对比
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'iteration8/requirements.txt'
      
      - name: 📦 Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('iteration8/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-
      
      - name: 📦 Cache embedding models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('iteration8/requirements.txt') }}
          restore-keys: |
            hf-models-
      
      - name: 📦 Install dependencies
        run: |
          cd iteration8
          # 使用 pip 的缓存和更快的安装选项
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt --prefer-binary
      
      - name: 🔍 Check corpus changes
        id: corpus_check
        run: |
          cd iteration8/corpus
          echo "📊 Current corpus files:"
          ls -lh doc-*.txt || echo "No doc files found"
          DOC_COUNT=$(ls doc-*.txt 2>/dev/null | wc -l)
          echo "doc_count=$DOC_COUNT" >> $GITHUB_OUTPUT
          echo "Total documents: $DOC_COUNT"
      
      - name: 🎲 Generate random query-from
        id: random_query
        run: |
          cd iteration8
          # 读取 queries.json 的总查询数
          TOTAL_QUERIES=$(python3 -c "import json; data=json.load(open('corpus/queries.json')); print(len(data))")
          echo "Total queries: $TOTAL_QUERIES"
          
          # 检查用户是否指定了 query_from
          USER_QUERY_FROM="${{ github.event.inputs.query_from }}"
          
          if [ -z "$USER_QUERY_FROM" ] || [ "$USER_QUERY_FROM" = "" ]; then
            # 用户未指定，生成真正的随机数（使用 /dev/urandom）
            RANDOM_FROM=$(( ( RANDOM % TOTAL_QUERIES ) + 1 ))
            # 使用当前时间作为额外的随机源
            TIME_SEED=$(($(date +%s%N) % TOTAL_QUERIES + 1))
            # 混合两个随机源
            RANDOM_FROM=$((( RANDOM_FROM + TIME_SEED ) % TOTAL_QUERIES + 1))
            echo "🎲 Randomly selected query-from: $RANDOM_FROM"
            echo "query_from=$RANDOM_FROM" >> $GITHUB_OUTPUT
          else
            # 用户指定了，使用用户的值
            echo "👤 Using user-specified query-from: $USER_QUERY_FROM"
            echo "query_from=$USER_QUERY_FROM" >> $GITHUB_OUTPUT
          fi
      
      - name: 🚀 Run evaluation
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          cd iteration8
          
          # 从手动输入或使用默认值
          CHUNKING="${{ github.event.inputs.chunking_strategy || 'fixed_100_50' }}"
          RETRIEVAL="${{ github.event.inputs.retrieval_mode || 'hybrid' }}"
          RERANK="${{ github.event.inputs.rerank_mode || 'bge' }}"
          JUDGE="${{ github.event.inputs.judge_mode || 'none' }}"
          PRESET="${{ github.event.inputs.rejection_preset || 'aggressive' }}"
          MAX_QUERIES="${{ github.event.inputs.max_queries || '1' }}"
          QUERY_FROM="${{ steps.random_query.outputs.query_from }}"  # 使用生成的随机值或用户指定的值
          BATCH_SIZE="${{ github.event.inputs.batch_size || '10' }}"
          
          echo "🔧 Configuration:"
          echo "  Chunking: $CHUNKING"
          echo "  Retrieval: $RETRIEVAL"
          echo "  Rerank: $RERANK"
          echo "  Judge: $JUDGE"
          echo "  Rejection Preset: $PRESET"
          echo "  Max Queries: $MAX_QUERIES"
          echo "  Query From: $QUERY_FROM (random or user-specified)"
          echo "  Batch Size: $BATCH_SIZE"
          
          # 运行评估，输出到 ../data 目录
          python run_eval.py \
            --chunking-strategy "$CHUNKING" \
            --retrieval-mode "$RETRIEVAL" \
            --rerank-mode "$RERANK" \
            --judge-mode "$JUDGE" \
            --rejection-preset "$PRESET" \
            --output-dir ../data \
            --max-queries "$MAX_QUERIES" \
            --query-from "$QUERY_FROM" \
            --batch-size "$BATCH_SIZE"
      
      - name: 📊 Generate HTML report
        run: |
          cd iteration8
          python generate_report.py \
            --data-dir ../data \
            --output-dir ../docs \
            --review-dir review
      
      - name: 📋 Check self-healing reviews
        id: review_check
        run: |
          cd iteration8
          if [ -d "review" ] && [ "$(ls -A review/*.json 2>/dev/null)" ]; then
            REVIEW_COUNT=$(ls review/*.json 2>/dev/null | wc -l)
            echo "review_count=$REVIEW_COUNT" >> $GITHUB_OUTPUT
            echo "📝 Found $REVIEW_COUNT pending review(s)"
          else
            echo "review_count=0" >> $GITHUB_OUTPUT
            echo "✅ No pending reviews"
          fi
      
      - name: 📈 Display summary
        run: |
          echo "✅ Evaluation completed!"
          echo ""
          echo "📁 Generated files:"
          ls -lh data/results_*.json | tail -5
          echo ""
          echo "📊 Report:"
          ls -lh docs/index.html
          echo ""
          echo "📊 Corpus stats:"
          echo "  Documents: ${{ steps.corpus_check.outputs.doc_count }}"
          echo ""
          echo "📝 Self-healing:"
          echo "  Pending reviews: ${{ steps.review_check.outputs.review_count }}"
      
      - name: 💾 Commit and push results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 添加结果文件和报告
          git add data/*.json
          git add docs/
          
          # 添加 review 目录（自愈机制生成的待审核文件）
          if [ -d "iteration8/review" ] && [ "$(ls -A iteration8/review/*.json 2>/dev/null)" ]; then
            git add iteration8/review/*.json
            echo "📝 Added review files"
          fi
          
          # 检查是否有变更
          if git diff --staged --quiet; then
            echo "⚠️  No changes to commit"
          else
            # 生成提交信息
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            DOC_COUNT=${{ steps.corpus_check.outputs.doc_count }}
            REVIEW_COUNT=${{ steps.review_check.outputs.review_count }}
            
            COMMIT_MSG="🤖 Auto-eval: $TIMESTAMP"
            COMMIT_MSG="$COMMIT_MSG"$'\n'"Documents: $DOC_COUNT"
            if [ "$REVIEW_COUNT" -gt 0 ]; then
              COMMIT_MSG="$COMMIT_MSG"$'\n'"Pending Reviews: $REVIEW_COUNT"
            fi
            COMMIT_MSG="$COMMIT_MSG"$'\n'"Config: ${{ github.event.inputs.chunking_strategy || 'fixed_100_50' }}+${{ github.event.inputs.retrieval_mode || 'hybrid' }}+${{ github.event.inputs.rerank_mode || 'bge' }}"
            
            git commit -m "$COMMIT_MSG"
            
            # 推送前先拉取最新代码，特别保护 review 文件
            echo "🔄 Pulling latest changes before push..."
            
            # 保存当前的 review 文件
            if [ -d "iteration8/review" ] && [ "$(ls -A iteration8/review/*.json 2>/dev/null)" ]; then
              mkdir -p /tmp/review_backup
              cp iteration8/review/*.json /tmp/review_backup/ 2>/dev/null || true
              echo "📦 Backed up $(ls /tmp/review_backup/*.json 2>/dev/null | wc -l) review files"
            fi
            
            # 拉取最新代码
            git pull --no-rebase origin main || {
              echo "⚠️  Pull failed, trying force push"
              
              # 恢复 review 文件
              if [ -d "/tmp/review_backup" ]; then
                cp /tmp/review_backup/*.json iteration8/review/ 2>/dev/null || true
                git add iteration8/review/*.json
                echo "🔄 Restored review files after pull failure"
              fi
              
              git push --force-with-lease origin main
              exit 0
            }
            
            # 合并后，确保 review 文件存在
            if [ -d "/tmp/review_backup" ]; then
              # 恢复可能在 pull 中丢失的 review 文件
              for backup_file in /tmp/review_backup/*.json; do
                filename=$(basename "$backup_file")
                if [ ! -f "iteration8/review/$filename" ]; then
                  cp "$backup_file" "iteration8/review/$filename"
                  git add "iteration8/review/$filename"
                  echo "🔄 Restored missing review file: $filename"
                fi
              done
              
              # 如果有恢复的文件，需要重新提交
              if ! git diff --staged --quiet; then
                git commit --amend --no-edit
              fi
            fi
            
            # 推送结果
            git push origin main
            echo "✅ Results committed and pushed"
          fi
      
      - name: 📝 Comment on commit (optional)
        if: github.event_name == 'push'
        run: |
          echo "📊 Evaluation completed for commit ${{ github.sha }}"
          echo "🌐 View report: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          echo "📝 Pending reviews: ${{ steps.review_check.outputs.review_count }}"
      
      # 失败时发送通知（可选，需要配置 Slack webhook 等）
      - name: 🚨 Notify on failure
        if: failure()
        run: |
          echo "❌ Evaluation failed! Check the logs for details."
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.event_name }}"
